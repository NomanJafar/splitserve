[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "splitserve"
version = "0.1.0"
description = "Disaggregated prefill/decode LLM serving: separate GPU pools with KV transfer, measuring the throughput and latency deltas against a monolithic server"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Noman Jafar", email = "numanjafarshahzad@gmail.com" }]
dependencies = ["httpx>=0.27", "fastapi>=0.110", "uvicorn>=0.29"]

[project.optional-dependencies]
plots = ["matplotlib>=3.8"]
dev = ["pytest>=8", "ruff>=0.6", "matplotlib>=3.8"]

[project.scripts]
splitserve-proxy = "splitserve.proxy:main"
splitserve-sim = "splitserve.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/splitserve"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
